name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs on the same ref — keeps the actions tab tidy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Spring Boot, JDK 25)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # [bin] tests (TesseractCliIT, OcrPipelineIT real-engine cases) fail instead of
      # being skipped when the binary is missing — CI must never go green on skips.
      CI_REQUIRE_TESSERACT: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install tesseract (eng + hin, same packs as the runtime image)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin
          tesseract --version
          tesseract --list-langs

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/**/*.gradle*', 'backend/**/gradle-wrapper.properties', 'backend/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build & test (excluding Docker-dependent integration tests)
        run: ./gradlew build -x :api-gateway:test --stacktrace

      - name: Integration tests (Testcontainers)
        run: ./gradlew :api-gateway:test --stacktrace

      - name: Upload test + coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/**/build/reports/tests/
            backend/**/build/reports/jacoco/

  web:
    name: Web (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate API client from OpenAPI spec
        run: npm run generate:api

      - name: Build
        run: npm run build

      - name: Test (headless Chrome)
        run: npm test

  mobile:
    name: Mobile (Flutter, Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (for Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Materialise Android platform stubs
        run: flutter create --platforms=android --org app.vaultdoc --project-name vaultdoc_mobile .

      - name: Generate API client from OpenAPI spec
        run: |
          # Resolve dev deps first (build_runner needs them); use --no-precompile
          # so it tolerates the missing path dep at this point.
          flutter pub get || true
          dart run build_runner build --delete-conflicting-outputs

      - name: Resolve packages (with generated client present)
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

  openapi:
    name: OpenAPI spec lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint OpenAPI
        run: npx --yes @redocly/cli lint openapi/vaultdoc.yaml
