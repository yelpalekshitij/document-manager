spring:
  application:
    name: vaultdoc-api-gateway
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vaultdoc}
    username: ${POSTGRES_USER:vaultdoc}
    password: ${POSTGRES_PASSWORD:vaultdoc_dev_pw}
  jpa:
    hibernate:
      ddl-auto: validate     # Flyway owns schema. JPA must never autocreate.
    open-in-view: false
    properties:
      hibernate.format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:vaultdoc_dev_pw}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

vaultdoc:
  elasticsearch:
    url: ${ELASTICSEARCH_URL:http://localhost:9200}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:vaultdoc}
    secret-key: ${S3_SECRET_KEY:vaultdoc_dev_pw}
    bucket: ${S3_BUCKET:vaultdoc-docs}
    region: ${S3_REGION:us-east-1}
  auth:
    jwt-secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-production-please-rotate-me}
    access-token-ttl: 1h
    refresh-token-ttl: 14d
  verification:
    token-ttl: 24h
    web-base-url: ${WEB_BASE_URL:http://localhost:4200}
    from-address: ${MAIL_FROM:no-reply@vaultdoc.local}
    resend-cooldown: 60s
  2fa:
    encryption-key: ${TWO_FA_ENCRYPTION_KEY:dev-only-2fa-enc-key-32chars-exactly!}
    issuer: ${TWO_FA_ISSUER:VaultDoc}
    token-ttl: 10m
  passkey:
    rp-id: ${PASSKEY_RP_ID:localhost}
    rp-name: ${PASSKEY_RP_NAME:VaultDoc}
    origins: ${PASSKEY_ORIGINS:http://localhost:4200}
    challenge-ttl: 5m
  storage:
    presign-put-ttl: 15m
    presign-get-ttl: 5m
  ingest:
    max-size-bytes: ${UPLOAD_MAX_SIZE_BYTES:52428800}    # 50 MB
    allowed-mime-types:
      - application/pdf
      - image/jpeg
      - image/png
      - image/webp
      - image/heic
      - image/tiff
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
  search:
    index-name: ${SEARCH_INDEX:vaultdoc-documents-v1}
    refresh-policy: ${SEARCH_REFRESH_POLICY:false}
  ocr:
    consumer-group: ${OCR_CONSUMER_GROUP:vaultdoc-ocr-consumers}
    batch-size: ${OCR_BATCH_SIZE:10}
    poll-timeout: ${OCR_POLL_TIMEOUT:2s}
    extracted-text-limit-bytes: ${OCR_EXTRACTED_TEXT_LIMIT:2000000}
    # Tesseract (Phase 1.4). Missing language packs degrade to the installed subset with a WARN.
    languages: ${OCR_LANGUAGES:eng+hin}
    tesseract-path: ${TESSERACT_PATH:tesseract}
    tessdata-dir: ${TESSDATA_DIR:}
    tesseract-timeout: ${OCR_TESSERACT_TIMEOUT:60s}
    max-image-bytes: ${OCR_MAX_IMAGE_BYTES:26214400}          # 25 MB
    max-image-pixels: ${OCR_MAX_IMAGE_PIXELS:50000000}        # 50 MP (also caps rendered PDF pages)
    pdf-ocr-fallback-enabled: ${OCR_PDF_FALLBACK_ENABLED:true}
    pdf-ocr-max-pages: ${OCR_PDF_MAX_PAGES:20}
    pdf-ocr-dpi: ${OCR_PDF_DPI:300}
    pdf-min-text-chars-per-page: ${OCR_PDF_MIN_TEXT_CHARS:25}
    temp-dir: ${OCR_TEMP_DIR:}
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://10.0.2.2:4200}

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui

logging:
  level:
    root: INFO
    app.vaultdoc: DEBUG
